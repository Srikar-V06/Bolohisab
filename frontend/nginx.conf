server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;

    if ($host !~ "^(localhost|127\.0\.0\.1)$") { return 421; }

    location /api/receipts/share/ {
        access_log off;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Bolo-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 81;
    server_name _;
    access_log off;

    location ~ "^/api/receipts/share/[A-Za-z0-9_-]{43}(/(confirm|dispute))?$" {
        proxy_pass http://backend:8000;
    }

    location / {
        return 404;
    }
}
